[tox]
envlist = py{310,311,312,313,314}, type
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-asyncio
    mock
commands =
    pytest -rp

[testenv:type]
package = skip
deps =
    httpx
    mypy
    pyright
commands =
    python -m mypy
    pyright dynatrace
    python -m mypy.stubtest dynatrace --mypy-config-file pyproject.toml --allowlist stubtest_allowlist.txt
